# Lancement 100 % local : ports liés à 127.0.0.1 uniquement.
services:
  php:
    build: ./docker
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:80
    environment:
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-volley}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_PORT=3306
      - APP_DEBUG=${APP_DEBUG:-0}
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-secret}
      - TZ=Europe/Paris
    volumes:
      - mysql-data-volley:/var/lib/mysql
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  mysql-data-volley:
